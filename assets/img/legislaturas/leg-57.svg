<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <!-- Fondo y Borde sutil transparente -->
  <rect width="340" height="70" rx="8" fill="#FBFBFC"/>
  <rect x="0.5" y="0.5" width="339" height="69" rx="7.5" stroke="#E5E7EB"/>

  <!-- Emblema LVII (1997-2000) Pluralidad Republicana -->
  <g transform="translate(14, 12)">
    <rect width="46" height="46" rx="8" fill="#4A3525"/>
    
    <!-- Monograma LVII -->
    <path d="M10 14 v18 h7 v-3 h-4 v-15 Z" fill="#D4AF37"/>
    <path d="M18 14 l3 13 l3 -13 h3.5 l-4.5 18 h-3.5 l-4.5 -18 Z" fill="#FFFFFF"/>
    <path d="M29 14 v18 h3 v-18 Z" fill="#D4AF37"/>
    <path d="M34 14 v18 h3 v-18 Z" fill="#D4AF37"/>
  </g>

  <!-- Tipografía Oficial LVII Legislatura -->
  <g transform="translate(70, 0)">
    <text x="0" y="27" fill="#4A3525" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">LVII LEGISLATURA</text>
    <text x="0" y="43" fill="#1C1C1E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">CÁMARA DE DIPUTADOS</text>
    <text x="0" y="55" fill="#6B7280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.2">PRIMERA MAYORÍA PLURAL &bull; 1997–2000</text>
  </g>

  <!-- Acento lateral bronce -->
  <path d="M334 18 v34" stroke="#4A3525" stroke-width="3" stroke-linecap="round"/>
</svg>
