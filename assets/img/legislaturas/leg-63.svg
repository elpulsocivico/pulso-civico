<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <!-- Fondo y Borde sutil transparente -->
  <rect width="340" height="70" rx="8" fill="#FBFBFC"/>
  <rect x="0.5" y="0.5" width="339" height="69" rx="7.5" stroke="#E5E7EB"/>

  <!-- Emblema LXIII (2015-2018) -->
  <g transform="translate(14, 12)">
    <rect width="46" height="46" rx="8" fill="#1B365D"/>
    
    <!-- Columnas y Monograma LXIII -->
    <path d="M10 14 v18 h8 v-3 h-5 v-15 Z" fill="#C49A45"/>
    <path d="M19 20 l3.5 5.5 l-3.5 5.5 h3.5 l1.8 -3 l1.8 3 h3.5 l-3.5 -5.5 l3.5 -5.5 h-3.5 l-1.8 3 l-1.8 -3 Z" fill="#FFFFFF"/>
    <path d="M31 14 v18 h3 v-18 Z" fill="#C49A45"/>
    <path d="M36 14 v18 h3 v-18 Z" fill="#C49A45"/>
    <path d="M41 14 v18 h3 v-18 Z" fill="#C49A45"/>
  </g>

  <!-- Tipografía Oficial LXIII Legislatura -->
  <g transform="translate(70, 0)">
    <text x="0" y="27" fill="#1B365D" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">LXIII LEGISLATURA</text>
    <text x="0" y="43" fill="#1C1C1E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">CÁMARA DE DIPUTADOS</text>
    <text x="0" y="55" fill="#6B7280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" letter-spacing="0.2">H. CONGRESO DE LA UNIÓN &bull; 2015–2018</text>
  </g>

  <!-- Acento lateral azul -->
  <path d="M334 18 v34" stroke="#1B365D" stroke-width="3" stroke-linecap="round"/>
</svg>
