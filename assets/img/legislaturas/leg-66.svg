<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <!-- Fondo y Borde sutil transparente -->
  <rect width="340" height="70" rx="8" fill="#FBFBFC"/>
  <rect x="0.5" y="0.5" width="339" height="69" rx="7.5" stroke="#E5E7EB"/>

  <!-- Emblema Geométrico LXVI -->
  <g transform="translate(14, 12)">
    <!-- Base / Escudo estilizado -->
    <rect width="46" height="46" rx="8" fill="#8B1C3F"/>
    
    <!-- Monograma Romano LXVI en Oro Institucional -->
    <path d="M11 13 v20 h10 v-3 h-6 v-17 Z" fill="#BC955C"/>
    <path d="M21 21 l4 6 l-4 6 h4 l2 -3.2 l2 3.2 h4 l-4 -6 l4 -6 h-4 l-2 3.2 l-2 -3.2 Z" fill="#FFFFFF"/>
    <path d="M34 13 v20 h4 v-20 Z" fill="#BC955C"/>
    <path d="M40 13 v20 h4 v-20 Z" fill="#BC955C"/>

    <circle cx="23" cy="9" r="1.5" fill="#BC955C"/>
  </g>

  <!-- Tipografía Oficial LXVI Legislatura -->
  <g transform="translate(70, 0)">
    <text x="0" y="27" fill="#8B1C3F" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">LXVI LEGISLATURA</text>
    <text x="0" y="43" fill="#1C1C1E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">CÁMARA DE DIPUTADOS</text>
    <text x="0" y="55" fill="#6B7280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" letter-spacing="0.3">H. CONGRESO DE LA UNIÓN &bull; 2024–2027</text>
  </g>

  <!-- Acento dorado lateral -->
  <path d="M334 18 v34" stroke="#BC955C" stroke-width="3" stroke-linecap="round"/>
</svg>
